<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Посты для Пульса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1620;
    --card:#16202C;
    --line:#22303F;
    --amber:#F5A524;
    --up:#3DD68C;
    --down:#F0616D;
    --text:#E6EDF3;
    --dim:#7D8FA3;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    padding:28px 20px 80px;
  }
  .wrap{max-width:1320px;margin:0 auto}

  header{
    display:flex;align-items:baseline;gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-size:26px;font-weight:700;margin:0;
    letter-spacing:-.4px;
  }
  h1 span{color:var(--amber)}
  .src{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--dim);
  }

  section{margin-top:34px}
  .bar{
    display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;margin-bottom:20px;
  }
  h2{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;font-weight:500;
    text-transform:uppercase;letter-spacing:1.4px;
    color:var(--dim);margin:0 0 14px;
  }

  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;font-weight:600;
    background:var(--amber);color:#0E1620;
    border:0;border-radius:8px;
    padding:12px 22px;cursor:pointer;
    transition:filter .15s;
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--text);outline-offset:2px}

  select,input{
    font-family:'IBM Plex Mono',monospace;font-size:14px;
    background:var(--card);color:var(--text);
    border:1px solid var(--line);border-radius:8px;
    padding:11px 13px;
  }
  select{min-width:280px}
  input{width:150px;text-transform:uppercase}
  select:focus,input:focus{outline:none;border-color:var(--amber)}

  .status{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--dim)}
  .err{
    font-family:'IBM Plex Mono',monospace;font-size:13px;
    color:var(--down);border:1px solid var(--down);
    border-radius:8px;padding:10px 14px;margin-top:14px;
    white-space:pre-wrap;display:none;
  }

  .row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;align-items:start;
  }
  .one{max-width:440px}

  .post{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    display:flex;flex-direction:column;gap:14px;
  }
  .cat{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--amber);
  }
  .title{font-size:17px;font-weight:600;line-height:1.35;margin:0}
  .body{
    font-size:14.5px;line-height:1.62;
    white-space:pre-wrap;margin:0;
  }
  .art{
    width:100%;aspect-ratio:1/1;
    border-radius:10px;overflow:hidden;
    background:#0B1119;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art .ph{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--dim);text-align:center;padding:14px;
  }
  .copy{
    background:transparent;color:var(--amber);
    border:1px solid var(--amber);
    font-size:14px;padding:10px 0;width:100%;
  }
  .copy:hover:not(:disabled){background:var(--amber);color:#0E1620}
  .copy.done{background:var(--up);border-color:var(--up);color:#0E1620}

  @media (max-width:980px){
    .row{grid-template-columns:1fr}
    .one{max-width:none}
    select,input{width:100%;min-width:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Посты для <span>Пульса</span></h1>
    <div class="src">Мосбиржа, задержка 15 мин</div>
  </header>

  <section>
    <h2>Утренний выпуск</h2>
    <div class="bar">
      <button id="bMorning">Сгенерировать утренние новости</button>
      <div class="status" id="sMorning"></div>
    </div>
    <div class="err" id="eMorning"></div>
    <div class="row" id="rowMorning"></div>
  </section>

  <section>
    <h2>Отдельный актив</h2>
    <div class="bar">
      <select id="pick">
        <optgroup label="Сырьё и металлы">
          <option value="BRU6">Нефть Brent — BRU6</option>
          <option value="NGU6">Природный газ — NGU6</option>
          <option value="GDU6">Золото — GDU6</option>
          <option value="SVU6">Серебро — SVU6</option>
        </optgroup>
        <optgroup label="Индексы и валюта">
          <option value="IMOEX">Индекс МосБиржи — IMOEX</option>
          <option value="RTSI">Индекс РТС — RTSI</option>
          <option value="USD000UTSTOM">Доллар — USD/RUB</option>
          <option value="CNYRUB_TOM">Юань — CNY/RUB</option>
        </optgroup>
        <optgroup label="Нефть и газ">
          <option value="GAZP">Газпром — GAZP</option>
          <option value="LKOH">Лукойл — LKOH</option>
          <option value="ROSN">Роснефть — ROSN</option>
          <option value="TATN">Татнефть — TATN</option>
          <option value="TATNP">Татнефть преф — TATNP</option>
          <option value="SNGS">Сургутнефтегаз — SNGS</option>
          <option value="SNGSP">Сургутнефтегаз преф — SNGSP</option>
          <option value="NVTK">НОВАТЭК — NVTK</option>
          <option value="SIBN">Газпром нефть — SIBN</option>
          <option value="TRNFP">Транснефть преф — TRNFP</option>
        </optgroup>
        <optgroup label="Металлурги и добыча">
          <option value="GMKN">Норникель — GMKN</option>
          <option value="PLZL">Полюс — PLZL</option>
          <option value="UGLD">ЮГК — UGLD</option>
          <option value="SELG">Селигдар — SELG</option>
          <option value="CHMF">Северсталь — CHMF</option>
          <option value="NLMK">НЛМК — NLMK</option>
          <option value="MAGN">ММК — MAGN</option>
          <option value="ALRS">АЛРОСА — ALRS</option>
          <option value="RUAL">РУСАЛ — RUAL</option>
          <option value="ENPG">Эн+ — ENPG</option>
          <option value="PHOR">ФосАгро — PHOR</option>
          <option value="RASP">Распадская — RASP</option>
        </optgroup>
        <optgroup label="Банки и финансы">
          <option value="SBER">Сбербанк — SBER</option>
          <option value="VTBR">ВТБ — VTBR</option>
          <option value="T">Т-Технологии — T</option>
          <option value="SVCB">Совкомбанк — SVCB</option>
          <option value="BSPB">Банк СПб — BSPB</option>
          <option value="CBOM">МКБ — CBOM</option>
          <option value="MOEX">Мосбиржа — MOEX</option>
          <option value="RENI">Ренессанс — RENI</option>
          <option value="AFKS">АФК Система — AFKS</option>
        </optgroup>
        <optgroup label="Технологии и потребление">
          <option value="YDEX">Яндекс — YDEX</option>
          <option value="OZON">Ozon — OZON</option>
          <option value="VKCO">VK — VKCO</option>
          <option value="POSI">Позитив — POSI</option>
          <option value="ASTR">Астра — ASTR</option>
          <option value="SOFL">Софтлайн — SOFL</option>
          <option value="WUSH">Вуш — WUSH</option>
          <option value="MGNT">Магнит — MGNT</option>
          <option value="LENT">Лента — LENT</option>
          <option value="X5">X5 — X5</option>
          <option value="MTSS">МТС — MTSS</option>
          <option value="RTKM">Ростелеком — RTKM</option>
          <option value="MDMG">Мать и дитя — MDMG</option>
        </optgroup>
        <optgroup label="Энергетика, транспорт, стройка">
          <option value="IRAO">Интер РАО — IRAO</option>
          <option value="HYDR">РусГидро — HYDR</option>
          <option value="FEES">Россети — FEES</option>
          <option value="UPRO">Юнипро — UPRO</option>
          <option value="AFLT">Аэрофлот — AFLT</option>
          <option value="FLOT">Совкомфлот — FLOT</option>
          <option value="NMTP">НМТП — NMTP</option>
          <option value="PIKK">ПИК — PIKK</option>
          <option value="SMLT">Самолёт — SMLT</option>
          <option value="LSRG">ЛСР — LSRG</option>
          <option value="SGZH">Сегежа — SGZH</option>
        </optgroup>
      </select>
      <input id="manual" placeholder="или тикер" maxlength="14">
      <button id="bAsset">Сгенерировать пост</button>
      <div class="status" id="sAsset"></div>
    </div>
    <div class="err" id="eAsset"></div>
    <div class="row one" id="rowAsset"></div>
  </section>

</div>

<script>
const BRAIN = 'https://pulse-brain.onrender.com';
const ART   = 'https://pulse-art.onrender.com';

const CATS = {
  oil:'Нефть и газ',
  gold:'Золото и серебро',
  index:'Индексы и акции',
  stock:'Актив'
};

function el(tag, cls, txt){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt != null) n.textContent = txt;
  return n;
}

function makeCard(post){
  const box = el('div','post');

  box.appendChild(el('div','cat', CATS[post.cat] || 'Пост'));
  box.appendChild(el('h3','title', post.title || ''));

  const art = el('div','art');
  art.appendChild(el('div','ph','Рисую картинку…'));
  box.appendChild(art);

  box.appendChild(el('p','body', post.text || ''));

  const btn = el('button','copy','Скопировать');
  btn.onclick = async () => {
    try{
      await navigator.clipboard.writeText(post.text || '');
      btn.textContent = 'Скопировано';
      btn.classList.add('done');
      setTimeout(()=>{ btn.textContent='Скопировать'; btn.classList.remove('done'); }, 1600);
    }catch(e){
      btn.textContent = 'Не вышло — выдели вручную';
    }
  };
  box.appendChild(btn);

  return { box, art };
}

async function drawArt(art, scene){
  if(!scene){ art.innerHTML=''; art.appendChild(el('div','ph','Сцена не пришла')); return; }
  try{
    const r = await fetch(ART, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ scene })
    });
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    if(!j.b64) throw new Error('пустой ответ');
    const img = new Image();
    img.alt = '';
    img.src = 'data:image/png;base64,' + j.b64;
    art.innerHTML = '';
    art.appendChild(img);
  }catch(e){
    art.innerHTML = '';
    art.appendChild(el('div','ph','Картинка не пришла: ' + e.message));
  }
}

async function run(opts){
  const { btn, status, errBox, row, payload, wait } = opts;

  btn.disabled = true;
  errBox.style.display = 'none';
  errBox.textContent = '';
  row.innerHTML = '';
  status.textContent = wait;

  try{
    const r = await fetch(BRAIN, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    if(!j.posts || !j.posts.length) throw new Error('мозг вернул пусто');

    status.textContent = 'Готово. Картинки дорисовываются.';

    const arts = [];
    j.posts.forEach(p => {
      const c = makeCard(p);
      row.appendChild(c.box);
      arts.push([c.art, p.scene]);
    });

    await Promise.all(arts.map(([a,s]) => drawArt(a,s)));
    status.textContent = 'Готово.';

  }catch(e){
    status.textContent = '';
    errBox.textContent = 'Ошибка: ' + e.message;
    errBox.style.display = 'block';
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('bMorning').onclick = () => run({
  btn:    document.getElementById('bMorning'),
  status: document.getElementById('sMorning'),
  errBox: document.getElementById('eMorning'),
  row:    document.getElementById('rowMorning'),
  payload:{},
  wait:'Читаю ленты и котировки. Первый запуск за день — до минуты.'
});

document.getElementById('bAsset').onclick = () => {
  const manual = document.getElementById('manual').value.trim().toUpperCase();
  const ticker = manual || document.getElementById('pick').value;
  run({
    btn:    document.getElementById('bAsset'),
    status: document.getElementById('sAsset'),
    errBox: document.getElementById('eAsset'),
    row:    document.getElementById('rowAsset'),
    payload:{ mode:'asset', ticker },
    wait:'Собираю данные по ' + ticker + '…'
  });
};

document.getElementById('manual').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('bAsset').click();
});
</script>
</body>
</html>
